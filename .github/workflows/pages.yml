# Build the Emscripten/WebAssembly game and deploy web/ to GitHub Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - name: Configure
        run: emcmake cmake -B build-web
      - name: Build
        run: cmake --build build-web -j $(nproc)
      - name: Stage Pages artifact
        run: |
          mkdir -p dist/assets
          cp web/index.html web/index.js web/index.wasm web/index.data dist/
          cp web/assets/*.ogg dist/assets/
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
