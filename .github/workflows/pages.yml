# Build the Emscripten/WebAssembly game and deploy web/ to GitHub Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # All actions pinned to commit SHAs (with tag comments for readability).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          # Pinned: CI's `latest` resolved to this on 2026-10-11.
          version: 6.0.12
      - name: Configure
        run: emcmake cmake -B build-web
      - name: Build
        run: cmake --build build-web -j $(nproc)
      - name: Stage Pages artifact
        run: |
          mkdir -p dist/assets
          cp web/index.html web/index.js web/index.wasm web/index.data dist/
          cp web/assets/*.ogg dist/assets/
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
